version: 2

project_name: anime

builds:
  - id: anime
    main: .
    binary: anime

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows
      - freebsd

    goarch:
      - amd64
      - arm64

    flags:
      - -trimpath

    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
